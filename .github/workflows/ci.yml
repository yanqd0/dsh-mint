name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5 # v5 起运行时 node24；v4 为 node20，已被 GitHub 弃用
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7 # v6 起内置 actions/github-script@v8（node24）；v5 内嵌 v7.0.1（node20）
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false # 上传失败（如 token 未配）不阻塞 CI
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: pnpm build
      - run: pnpm pack:check
